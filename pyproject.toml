[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-cognitive"
version = "0.3.0"
description = "GENESIS: an experimental cognitive architecture that learns world rules from experience, starting from innate primitives only"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
genesis = "genesis.__main__:main"

[tool.setuptools.packages.find]
include = ["genesis*"]

[tool.setuptools.package-data]
"genesis" = ["_search.c"]
"genesis.nn" = ["_kernels.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
